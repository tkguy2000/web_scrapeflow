<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400">
  <link rel="stylesheet" href="popup.css">
  <title>ScrapeFlow</title>
</head>
<body>
  <div id="app">
    <header class="header">
      <h1 class="logo">ScrapeFlow</h1>
      <div class="header-controls">
        <!-- 테마 토글: 다크/라이트/시스템 -->
        <div class="theme-toggle" id="theme-toggle" role="radiogroup" aria-label="Theme">
          <button class="theme-btn active" data-theme="dark" title="Dark" aria-label="Dark mode">🌙</button>
          <button class="theme-btn" data-theme="light" title="Light" aria-label="Light mode">☀️</button>
          <button class="theme-btn" data-theme="system" title="System" aria-label="System theme">💻</button>
        </div>
        <!-- 한/영 토글 -->
        <button class="lang-toggle" id="lang-toggle" title="Language">EN/한</button>
      </div>
    </header>

    <!-- 페이지 미리보기 -->
    <div id="page-info" class="page-info" role="region" aria-label="Current page info">
      <div class="page-title" id="page-title">Loading page...</div>
      <div class="page-url" id="page-url"></div>
      <div class="page-stats" id="page-stats" aria-live="polite"></div>
    </div>

    <!-- 액션 버튼 -->
    <div class="actions">
      <button id="btn-extract" class="btn btn-primary"
        aria-label="Extract page data" tabindex="1">
        <span class="btn-icon" aria-hidden="true">📊</span>
        Extract Data
      </button>
      <button id="btn-capture" class="btn btn-secondary"
        aria-label="Capture full page" tabindex="2">
        <span class="btn-icon" aria-hidden="true">📸</span>
        Full Page Capture
      </button>
    </div>

    <!-- 푸터 -->
    <footer class="footer">
      <span class="version">v0.3.0</span>
    </footer>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
