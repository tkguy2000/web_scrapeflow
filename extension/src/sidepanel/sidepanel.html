<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="sidepanel.css">
  <title>ScrapeFlow</title>
</head>
<body>
  <div id="app">
    <!-- 헤더 -->
    <header class="header">
      <h1 class="logo">ScrapeFlow</h1>
      <span class="badge">AI</span>
      <button class="lang-toggle" id="lang-toggle" title="Language">EN/한</button>
    </header>

    <!-- 소스 정보 -->
    <div id="source-bar" class="source-bar hidden">
      <span class="source-label" data-i18n="source">Source:</span>
      <span id="source-name" class="source-name"></span>
    </div>

    <!-- 분석 시작 섹션 -->
    <div id="analyze-section" class="analyze-section">
      <button id="btn-analyze" class="btn btn-analyze btn-lg">
        <span id="analyze-icon" class="analyze-icon">🔍</span>
        <span id="analyze-text" data-i18n="analyzeSite">Analyze Site</span>
      </button>
      <p id="analyze-status" class="analyze-status"></p>
    </div>

    <!-- 결과 섹션 -->
    <div id="result-section" class="result-section hidden">
      <!-- 결과 요약 -->
      <div id="result-info" class="result-info"></div>

      <!-- 데이터 다운로드 -->
      <h3 class="section-title" data-i18n="exportData">Export Data</h3>
      <div class="download-grid">
        <button class="btn btn-download export-btn" data-format="json">
          <span class="dl-icon">📄</span>
          <span class="dl-label">JSON</span>
        </button>
        <button class="btn btn-download export-btn" data-format="csv">
          <span class="dl-icon">📊</span>
          <span class="dl-label">CSV</span>
        </button>
        <button class="btn btn-download export-btn" data-format="clipboard">
          <span class="dl-icon">📋</span>
          <span class="dl-label" data-i18n="copy">Copy</span>
        </button>
      </div>

      <!-- 사이트 복제 -->
      <h3 class="section-title" data-i18n="siteClone">Site Clone</h3>
      <div class="download-grid">
        <button id="btn-clone-html" class="btn btn-download">
          <span class="dl-icon">🌐</span>
          <span class="dl-label" data-i18n="htmlClone">HTML Clone</span>
        </button>
        <button id="btn-site-package" class="btn btn-download btn-accent">
          <span class="dl-icon">📦</span>
          <span class="dl-label" data-i18n="sitePackage">Site Package</span>
        </button>
      </div>

      <!-- 결과 테이블 (접이식) -->
      <details class="result-details">
        <summary class="result-summary">
          <span id="table-toggle-text" data-i18n="viewData">View Extracted Data</span>
        </summary>
        <div class="table-wrapper">
          <table id="result-table" class="data-table">
            <thead id="result-head"></thead>
            <tbody id="result-body"></tbody>
          </table>
        </div>
        <div id="pagination" class="pagination hidden">
          <button id="btn-prev" class="btn btn-ghost btn-sm" disabled>&lt;</button>
          <span id="page-info">1</span>
          <button id="btn-next" class="btn btn-ghost btn-sm">&gt;</button>
        </div>
      </details>
    </div>

    <!-- 에러 -->
    <p id="error-msg" class="error-msg hidden"></p>
  </div>

  <script type="module" src="sidepanel.ts"></script>
</body>
</html>
