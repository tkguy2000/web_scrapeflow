<!DOCTYPE html>
<html>
<head><title>ScrapeFlow Icon Generator</title></head>
<body style="background:#222;color:#fff;font-family:sans-serif;padding:40px;text-align:center;">
  <h2>ScrapeFlow Icon Generator</h2>
  <p>아래 아이콘을 클릭하면 다운로드됩니다.</p>
  <div id="icons" style="display:flex;gap:32px;justify-content:center;margin-top:32px;align-items:end;"></div>
  <script>
    const sizes = [16, 48, 128];

    sizes.forEach(size => {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // 둥근 사각형 배경 (그라디언트)
      const radius = size * 0.22;
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#6c5ce7');
      grad.addColorStop(1, '#8b5cf6');

      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(size - radius, 0);
      ctx.quadraticCurveTo(size, 0, size, radius);
      ctx.lineTo(size, size - radius);
      ctx.quadraticCurveTo(size, size, size - radius, size);
      ctx.lineTo(radius, size);
      ctx.quadraticCurveTo(0, size, 0, size - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();

      // "S" 글자
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${size * 0.6}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('S', size / 2, size / 2 + size * 0.03);

      // 표시 및 다운로드 링크
      const wrapper = document.createElement('div');

      const display = document.createElement('img');
      display.src = canvas.toDataURL('image/png');
      display.style.cssText = `width:${Math.max(size, 64)}px;height:${Math.max(size, 64)}px;image-rendering:pixelated;cursor:pointer;border:1px solid #444;border-radius:8px;`;

      const link = document.createElement('a');
      link.href = canvas.toDataURL('image/png');
      link.download = `icon${size}.png`;
      link.appendChild(display);

      const label = document.createElement('div');
      label.textContent = `${size}x${size}`;
      label.style.cssText = 'margin-top:8px;font-size:14px;color:#999;';

      wrapper.appendChild(link);
      wrapper.appendChild(label);
      document.getElementById('icons').appendChild(wrapper);
    });
  </script>
</body>
</html>
