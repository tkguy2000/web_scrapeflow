  <style>
:root {
  --bg: #f5f5f0;
  --text: #333;
  --accent: #8b7355;
  --card-bg: #fff;
  --border: #e0ddd5;
  --font-heading: 'EB Garamond', Georgia, serif;
  --font-body: 'Lato', -apple-system, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  font-size: 16px;
}

.container {
  max-width: 800px;
  margin: 0 auto;
  padding: 0 20px;
}

/* Header */
.site-header {
  background: #8b7355;
  color: #fff;
  padding: 40px 0;
  text-align: center;
}

.site-title {
  font-family: var(--font-heading);
  font-size: 2.5em;
  font-weight: 400;
  margin-bottom: 8px;
}

.site-subtitle {
  font-size: 14px;
  opacity: 0.85;
  max-width: 600px;
  margin: 0 auto;
  line-height: 1.5;
}

/* Navigation */
nav {
  background: var(--card-bg);
  border-bottom: 1px solid var(--border);
  padding: 12px 0;
  position: sticky;
  top: 0;
  z-index: 100;
}

nav .container {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

nav a {
  color: var(--accent);
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
}

.categories {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.cat-tag {
  font-size: 11px;
  background: #f0ede5;
  color: #8b7355;
  padding: 2px 8px;
  border-radius: 3px;
  text-decoration: none;
}

/* Post cards */
.post-list {
  padding: 30px 0;
}

.post-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  margin-bottom: 24px;
  overflow: hidden;
  transition: box-shadow 0.2s;
}

.post-card:hover {
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}

.post-card-image {
  width: 100%;
  height: 250px;
  object-fit: cover;
  display: block;
}

.post-card-body {
  padding: 24px;
}

.post-card-date {
  font-size: 12px;
  color: #999;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.post-card-title {
  font-family: var(--font-heading);
  font-size: 1.5em;
  margin: 8px 0;
}

.post-card-title a {
  color: var(--text);
  text-decoration: none;
}

.post-card-title a:hover {
  color: var(--accent);
}

.post-card-excerpt {
  color: #666;
  font-size: 14px;
  line-height: 1.6;
}

.post-card-meta {
  margin-top: 16px;
  display: flex;
  gap: 12px;
}

.post-card-label {
  font-size: 11px;
  background: #f0ede5;
  color: #8b7355;
  padding: 2px 8px;
  border-radius: 3px;
}

/* Single post */
.post-header {
  padding: 40px 0 20px;
}

.post-title {
  font-family: var(--font-heading);
  font-size: 2.2em;
  font-weight: 400;
  margin-bottom: 8px;
}

.post-date {
  color: #999;
  font-size: 14px;
}

.post-content {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 32px;
  margin-bottom: 40px;
}

.post-content img {
  max-width: 100%;
  height: auto;
  border-radius: 4px;
  margin: 16px 0;
}

.post-content iframe {
  max-width: 100%;
  margin: 16px 0;
}

.post-content a {
  color: var(--accent);
}

.post-labels {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

/* Back link */
.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: var(--accent);
  text-decoration: none;
  font-size: 14px;
}

/* Footer */
.site-footer {
  text-align: center;
  padding: 30px 0;
  font-size: 12px;
  color: #999;
  border-top: 1px solid var(--border);
}

/* Responsive */
@media (max-width: 600px) {
  .site-title { font-size: 1.8em; }
  .post-title { font-size: 1.6em; }
  .post-content { padding: 20px; }
  .post-card-image { height: 180px; }
}
</style>
